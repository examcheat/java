<style>
:root{

}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.titlebar{background:var(--chrome);display:flex;align-items:center;height:32px;padding-left:10px;font-size:12px;border-bottom:1px solid var(--border);user-select:none}
.titlebar .ico{width:14px;height:16px;background:#4fa3e3;border-radius:2px;margin-right:8px;position:relative}
.titlebar .ico:after{content:"";position:absolute;left:2px;right:2px;top:5px;height:6px;border-top:1px solid #fff;border-bottom:1px solid #fff}
.titlebar .wc{margin-left:auto;display:flex;height:100%}
.titlebar .wc span{width:46px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.menubar{background:var(--chrome);display:flex;font-size:13px;border-bottom:1px solid var(--border);position:relative;user-select:none;flex-wrap:wrap}
.menu{position:relative}
.menu>button{background:none;border:0;color:var(--fg);font:inherit;padding:4px 10px;cursor:default}
.menu>button:hover,.menu.open>button{background:var(--btn)}
.dd{display:none;position:absolute;top:100%;left:0;min-width:210px;background:var(--chrome);border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:20;padding:3px 0}
.menu.open .dd{display:block}
.dd button{display:flex;justify-content:space-between;gap:24px;width:100%;background:none;border:0;color:var(--fg);font:inherit;padding:5px 14px;text-align:left;cursor:default}
.dd button:hover{background:var(--sel)}
.dd hr{border:0;border-top:1px solid var(--border);margin:3px 0}
.dd .k{color:var(--muted)}
#editor{flex:1;overflow:auto;padding:12px 18px 40px;font-family:var(--font);font-size:var(--size);line-height:1.45}
.entry{margin-bottom:30px}
.qbar{display:flex;align-items:flex-start;gap:12px;background:var(--q);border:1px solid var(--border);border-left:4px solid #0067c0;padding:8px 10px}
.qtext{flex:1;white-space:pre-wrap;word-break:break-word;margin:0;font:inherit;font-weight:600}
.copy{flex:none;font:13px "Segoe UI",system-ui,sans-serif;background:var(--btn);color:var(--fg);border:1px solid var(--border);padding:5px 14px;cursor:pointer;min-width:84px}
.copy:hover{background:var(--btnh)}
.copy.done{color:var(--ok);font-weight:600}
pre.code{margin:0;padding:10px 4px 0;white-space:pre;overflow-x:auto;tab-size:4}
.wrap pre.code{white-space:pre-wrap;word-break:break-word}
.file{font:12px "Segoe UI",system-ui,sans-serif;color:var(--muted);padding:6px 4px 0}
::selection{background:var(--sel)}
.status{background:var(--chrome);border-top:1px solid var(--border);font-size:12px;display:flex;gap:0;color:var(--fg);user-select:none;flex-wrap:wrap}
.status span{padding:3px 14px;border-right:1px solid var(--border)}
.status .grow{flex:1}
@media(max-width:600px){.qbar{flex-direction:column}.copy{align-self:flex-end}.status span:nth-child(n+4){display:none}#editor{padding:10px}}
</style>

<script id="data" type="application/json">[{"file": "Q1_RectangleArea.java", "question": "Q1\nA) Define the concept of class and object in Java. (5 Marks)\nB) Write a program in Java to calculate area of rectangle\n   using class and object concept. (15 Marks)\nC) Oral (5 Marks)", "code": "/*\n * ============================================================\n * Q1\n * A) Define the concept of class and object in Java. (5 Marks)\n * B) Write a program in Java to calculate area of rectangle\n *    using class and object concept. (15 Marks)\n * C) Oral (5 Marks)\n * ============================================================\n *\n * ---------------- PART A : THEORY ----------------\n *\n * CLASS:\n *  - A class is a blueprint (template) from which objects are created.\n *  - It defines the data (variables / fields / attributes) and the\n *    behaviour (methods) that its objects will have.\n *  - A class does not occupy memory for its data until an object is created.\n *  - Syntax:\n *        class ClassName {\n *            // fields\n *            // methods\n *        }\n *\n * OBJECT:\n *  - An object is an instance of a class (a real entity created from the blueprint).\n *  - It has: State (values of fields), Behaviour (methods), Identity (unique address).\n *  - Objects are created using the 'new' keyword:\n *        ClassName obj = new ClassName();\n *  - Memory for the object is allocated on the heap.\n *\n * Example: Class = \"Car\" (blueprint), Object = \"my red Honda\" (real car).\n *\n * ---------------- PART B : PROGRAM ----------------\n *\n * AIM      : To calculate the area of a rectangle using class and object.\n * OBJECTIVE: To understand how a class holds data + methods and how an\n *            object is created and used to call those methods.\n *\n * ALGORITHM:\n *  1. Create class Rectangle with fields length and width.\n *  2. Add method setData() to assign values and method area() to compute.\n *  3. In main(), create an object of Rectangle using 'new'.\n *  4. Take input from user, call setData() and area().\n *  5. Display the result.\n *\n * EXPECTED OUTPUT (for length = 10, width = 5):\n *      Enter length of rectangle: 10\n *      Enter width of rectangle: 5\n *      Length = 10.0\n *      Width  = 5.0\n *      Area of Rectangle = 50.0\n *\n * HOW TO RUN:\n *      javac Q1_RectangleArea.java\n *      java Q1_RectangleArea\n */\n\nclass Rectangle {\n    double length, breadth;\n\n    void setData(double l, double b) {\n        length = l;\n        breadth = b;\n    }\n\n    double area() {\n        return length * breadth;\n    }\n\n    public static void main(String[] args) {\n        Rectangle r = new Rectangle();\n        r.setData(10, 5);\n        System.out.println(\"Length = \" + r.length);\n        System.out.println(\"Breadth = \" + r.breadth);\n        System.out.println(\"Area of rectangle = \" + r.area());\n    }\n}\n\n/*\n * ---------------- PART C : ORAL QUESTIONS (with short answers) ----------------\n * Q. Difference between class and object?  -> Class is a blueprint; object is its instance.\n * Q. Which keyword creates an object?      -> new\n * Q. Where are objects stored?             -> Heap memory.\n * Q. What is 'this' keyword?               -> Reference to the current object.\n * Q. What is a method?                     -> A block of code that performs a task.\n * Q. Can a Java file have multiple classes?-> Yes, but only one public class, whose name matches the file.\n */\n"}, {"file": "Q2_ParameterizedConstructor.java", "question": "Q2\nA) Define the constructor in Java. Discuss the types of constructors. (5 Marks)\nB) Write a program to demonstrate the parameterized constructor. (15 Marks)\nC) Oral (5 Marks)", "code": "/*\n * ============================================================\n * Q2\n * A) Define the constructor in Java. Discuss the types of constructors. (5 Marks)\n * B) Write a program to demonstrate the parameterized constructor. (15 Marks)\n * C) Oral (5 Marks)\n * ============================================================\n *\n * ---------------- PART A : THEORY ----------------\n *\n * CONSTRUCTOR:\n *  - A constructor is a special method used to initialize an object.\n *  - It is called automatically when an object is created using 'new'.\n *  - Rules:\n *      1. Constructor name must be SAME as the class name.\n *      2. It has NO return type (not even void).\n *      3. It cannot be static, final or abstract.\n *      4. Can be overloaded (many constructors with different parameters).\n *\n * TYPES OF CONSTRUCTORS:\n *  1. Default constructor:\n *       - Has no parameters. If the programmer writes no constructor, the\n *         Java compiler provides one automatically (it sets default values:\n *         0, null, false).\n *  2. No-argument constructor:\n *       - Written explicitly by the programmer, takes no arguments.\n *  3. Parameterized constructor:\n *       - Takes parameters, used to initialize the object with different\n *         values at the time of creation.\n *  4. Copy constructor (user defined in Java):\n *       - Creates a new object by copying the data of an existing object.\n *\n * ---------------- PART B : PROGRAM ----------------\n *\n * AIM      : To demonstrate the parameterized constructor.\n * OBJECTIVE: To initialize different objects with different values at\n *            the time of creation.\n *\n * ALGORITHM:\n *  1. Create class Student with fields id, name, marks.\n *  2. Write a parameterized constructor Student(int, String, double).\n *  3. In main(), create two objects passing different values.\n *  4. Call display() to print the data of each.\n *\n * EXPECTED OUTPUT:\n *      Constructor called for: Amit\n *      Constructor called for: Sneha\n *      ID: 101, Name: Amit, Marks: 85.5\n *      ID: 102, Name: Sneha, Marks: 92.0\n *      Copy of s1 -> ID: 101, Name: Amit, Marks: 85.5\n *\n * HOW TO RUN:\n *      javac Q2_ParameterizedConstructor.java\n *      java Q2_ParameterizedConstructor\n */\n\nclass Student {\n    int rollNo;\n    String name;\n\n    Student(int r, String n) {\n        rollNo = r;\n        name = n;\n    }\n\n    void display() {\n        System.out.println(\"Roll No = \" + rollNo);\n        System.out.println(\"Name = \" + name);\n    }\n\n    public static void main(String[] args) {\n        Student s = new Student(12, \"Amit\");\n        s.display();\n    }\n}\n\n/*\n * ---------------- PART C : ORAL QUESTIONS ----------------\n * Q. Can a constructor be overloaded?   -> Yes.\n * Q. Can a constructor return a value?  -> No, it has no return type.\n * Q. What if we don't write any constructor? -> Compiler adds a default constructor.\n * Q. Difference between constructor and method? -> Constructor initializes object, has class\n *    name, no return type, called automatically; method performs an action, has return type,\n *    called explicitly.\n * Q. What is constructor chaining?      -> Calling one constructor from another using this().\n * Q. Can a constructor be private?      -> Yes (used in Singleton pattern).\n */\n"}, {"file": "Q3_AbstractClass.java", "question": "Q3\nA) What is abstract class and abstract method in Java? (5 Marks)\nB) Write a program to demonstrate the concept of abstract class\n   and method. (15 Marks)\nC) Oral (5 Marks)", "code": "/*\n * ============================================================\n * Q3\n * A) What is abstract class and abstract method in Java? (5 Marks)\n * B) Write a program to demonstrate the concept of abstract class\n *    and method. (15 Marks)\n * C) Oral (5 Marks)\n * ============================================================\n *\n * ---------------- PART A : THEORY ----------------\n *\n * ABSTRACT CLASS:\n *  - A class declared with the 'abstract' keyword.\n *  - Cannot be instantiated (no object can be created directly).\n *  - Can contain abstract methods AND normal (concrete) methods,\n *    constructors, variables and static methods.\n *  - Must be extended by a subclass which provides the implementation\n *    of all its abstract methods (otherwise the subclass is also abstract).\n *  - Used to achieve partial abstraction (0 - 100%).\n *\n * ABSTRACT METHOD:\n *  - A method declared with 'abstract' keyword and WITHOUT a body.\n *        abstract void draw();\n *  - Only the signature is given; the child class defines the body.\n *  - If a class has even one abstract method, the class must be abstract.\n *\n * Syntax:\n *      abstract class Shape {\n *          abstract void area();      // abstract method\n *          void show() { ... }        // concrete method\n *      }\n *\n * ---------------- PART B : PROGRAM ----------------\n *\n * AIM      : To demonstrate abstract class and abstract method.\n * OBJECTIVE: To hide implementation details and force subclasses to\n *            provide their own implementation.\n *\n * ALGORITHM:\n *  1. Create abstract class Shape with abstract method area() and a\n *     concrete method display().\n *  2. Create classes Circle and Rectangle extending Shape and\n *     override area().\n *  3. In main(), use a Shape reference to point to subclass objects\n *     (runtime polymorphism) and call area().\n *\n * EXPECTED OUTPUT:\n *      This is a shape.\n *      Area of Circle = 78.53981633974483\n *      This is a shape.\n *      Area of Rectangle = 50.0\n *\n * HOW TO RUN:\n *      javac Q3_AbstractClass.java\n *      java Q3_AbstractClass\n */\n\nabstract class Shape {\n    abstract void draw();\n}\n\nclass Circle extends Shape {\n    void draw() {\n        System.out.println(\"Drawing a circle\");\n    }\n\n    public static void main(String[] args) {\n        Shape s = new Circle();\n        s.draw();\n    }\n}\n\n/*\n * ---------------- PART C : ORAL QUESTIONS ----------------\n * Q. Can we create an object of an abstract class? -> No.\n * Q. Can an abstract class have a constructor?     -> Yes (called via super() from subclass).\n * Q. Can an abstract class have no abstract method?-> Yes.\n * Q. Difference between abstract class and interface? -> Abstract class: partial abstraction,\n *    can have state & constructors, single inheritance. Interface: 100% abstraction (before\n *    Java 8), multiple inheritance supported.\n * Q. Can abstract methods be private/final/static? -> No.\n * Q. What is runtime polymorphism?                 -> Superclass reference calling the\n *    overridden method of a subclass object.\n */\n"}, {"file": "Q4_SingleInheritance.java", "question": "Q4\nA) Explain the term inheritance in Java. Discuss the types of\n   inheritance. (5 Marks)\nB) Write a program to demonstrate single inheritance in Java. (15 Marks)\nC) Oral (5 Marks)", "code": "/*\n * ============================================================\n * Q4\n * A) Explain the term inheritance in Java. Discuss the types of\n *    inheritance. (5 Marks)\n * B) Write a program to demonstrate single inheritance in Java. (15 Marks)\n * C) Oral (5 Marks)\n * ============================================================\n *\n * ---------------- PART A : THEORY ----------------\n *\n * INHERITANCE:\n *  - Mechanism by which one class (child / subclass / derived class)\n *    acquires the properties (fields) and behaviours (methods) of\n *    another class (parent / superclass / base class).\n *  - Keyword used: 'extends'.\n *  - Advantages: code reusability, method overriding (runtime\n *    polymorphism), easy maintenance.\n *  - Represents the IS-A relationship (Dog IS-A Animal).\n *\n * TYPES OF INHERITANCE:\n *  1. Single      : One child extends one parent.        A -> B\n *  2. Multilevel  : Chain of inheritance.               A -> B -> C\n *  3. Hierarchical: Many children extend one parent.     A -> B, A -> C\n *  4. Multiple    : A class inherits from more than one class.\n *                   NOT supported with classes in Java (to avoid the\n *                   diamond problem); achieved using interfaces.\n *  5. Hybrid      : Combination of the above; also only possible\n *                   through interfaces in Java.\n *\n * ---------------- PART B : PROGRAM ----------------\n *\n * AIM      : To demonstrate single inheritance.\n * OBJECTIVE: To reuse the members of a parent class in a child class.\n *\n * ALGORITHM:\n *  1. Create parent class Animal with method eat().\n *  2. Create child class Dog that extends Animal and adds bark().\n *  3. In main(), create an object of Dog and call both eat() (inherited)\n *     and bark() (own).\n *\n * EXPECTED OUTPUT:\n *      Animal name: Tommy\n *      Tommy is eating...\n *      Tommy is barking: Woof Woof!\n *\n * HOW TO RUN:\n *      javac Q4_SingleInheritance.java\n *      java Q4_SingleInheritance\n */\n\nclass Animal {\n    void eat() {\n        System.out.println(\"Animal eats food\");\n    }\n}\n\nclass Dog extends Animal {\n    void bark() {\n        System.out.println(\"Dog barks\");\n    }\n\n    public static void main(String[] args) {\n        Dog d = new Dog();\n        d.eat();\n        d.bark();\n    }\n}\n\n/*\n * ---------------- PART C : ORAL QUESTIONS ----------------\n * Q. Why is multiple inheritance not supported with classes? -> Ambiguity (diamond problem).\n * Q. How do we achieve multiple inheritance in Java?         -> Using interfaces.\n * Q. What is the use of 'super' keyword?  -> Refers to the parent class members/constructor.\n * Q. What is method overriding?           -> Child redefines a parent method with same signature.\n * Q. Which class is the parent of all classes in Java? -> java.lang.Object.\n * Q. Can a class extend a final class?    -> No.\n * Q. Are private members inherited?       -> No, not accessible in the child class.\n */\n"}, {"file": "Q5_ArithmeticException.java", "question": "Q5\nA) Explain the exception handling in Java. State the use of try,\n   catch, throw, throws, finally keywords. (5 Marks)\nB) Write a program to demonstrate arithmetic exception handling\n   in Java. (15 Marks)\nC) Oral (5 Marks)", "code": "/*\n * ============================================================\n * Q5\n * A) Explain the exception handling in Java. State the use of try,\n *    catch, throw, throws, finally keywords. (5 Marks)\n * B) Write a program to demonstrate arithmetic exception handling\n *    in Java. (15 Marks)\n * C) Oral (5 Marks)\n * ============================================================\n *\n * ---------------- PART A : THEORY ----------------\n *\n * EXCEPTION:\n *  - An unwanted event that occurs at run time and disturbs the\n *    normal flow of the program (e.g. divide by zero, file not found).\n *\n * EXCEPTION HANDLING:\n *  - A mechanism to handle run-time errors so that the normal flow of\n *    the program is maintained and the program does not terminate abruptly.\n *  - Hierarchy: Throwable -> (Error, Exception).\n *      Checked exceptions   : checked at compile time (IOException, SQLException).\n *      Unchecked exceptions : occur at run time (ArithmeticException,\n *                             NullPointerException, ArrayIndexOutOfBoundsException).\n *\n * KEYWORDS:\n *  try     : Block containing code that may throw an exception.\n *  catch   : Block that handles the exception thrown in the try block.\n *  throw   : Used to explicitly throw an exception object.\n *               throw new ArithmeticException(\"message\");\n *  throws  : Used in a method declaration to say the method may pass\n *            (declare) exceptions to the caller.\n *               void read() throws IOException { }\n *  finally : Block that ALWAYS executes (whether exception occurs or not);\n *            used for cleanup such as closing files / connections.\n *\n * ---------------- PART B : PROGRAM ----------------\n *\n * AIM      : To demonstrate ArithmeticException handling.\n * OBJECTIVE: To handle divide-by-zero error using try-catch-finally,\n *            and show throw and throws keywords.\n *\n * ALGORITHM:\n *  1. Take two numbers from the user.\n *  2. Inside try, divide the first by the second.\n *  3. If the divisor is 0, ArithmeticException occurs; catch prints a message.\n *  4. finally block always runs.\n *  5. Demonstrate 'throw' and 'throws' with a separate method.\n *\n * EXPECTED OUTPUT (input 10 and 0):\n *      Enter first number: 10\n *      Enter second number: 0\n *      Exception caught: java.lang.ArithmeticException: / by zero\n *      Cannot divide a number by zero.\n *      finally block: always executed.\n *      throw/throws demo -> Caught: Divisor must not be zero (custom)\n *      Program ended normally.\n *\n * EXPECTED OUTPUT (input 10 and 2):\n *      Result = 5\n *      finally block: always executed.\n *\n * HOW TO RUN:\n *      javac Q5_ArithmeticException.java\n *      java Q5_ArithmeticException\n */\n\nclass ArithmeticExceptionDemo {\n    public static void main(String[] args) {\n        int a = 10, b = 0;\n\n        try {\n            int result = a / b;\n            System.out.println(\"Result = \" + result);\n        } catch (ArithmeticException e) {\n            System.out.println(\"Cannot divide by zero.\");\n        }\n\n        System.out.println(\"Program continues.\");\n    }\n}\n\n/*\n * ---------------- PART C : ORAL QUESTIONS ----------------\n * Q. Difference between throw and throws?  -> throw: used inside a method to throw an exception;\n *    throws: used in the method signature to declare exceptions.\n * Q. Difference between checked and unchecked exception? -> Checked: compile time; unchecked: run time.\n * Q. Is finally always executed?  -> Yes, except System.exit() or JVM crash.\n * Q. Can we have multiple catch blocks? -> Yes.\n * Q. Can try exist without catch?  -> Yes, if a finally block is present.\n * Q. What is the parent class of all exceptions? -> Throwable.\n * Q. Difference between Error and Exception? -> Error is serious, not meant to be handled\n *    (OutOfMemoryError); Exception can be handled.\n */\n"}, {"file": "Q6_ChangeBackground.html", "question": "Q6\nA) What is the Document Object Model (DOM)? What is the purpose of\n   JavaScript in web development? (5 Marks)\nB) Write a program for JavaScript based on Document Object Model to\n   change the background color of web page automatically after\n   every 5 seconds. (15 Marks)\nC) Oral (5 Marks)", "code": "\u003c!--\n============================================================\nQ6\nA) What is the Document Object Model (DOM)? What is the purpose of\n   JavaScript in web development? (5 Marks)\nB) Write a program for JavaScript based on Document Object Model to\n   change the background color of web page automatically after\n   every 5 seconds. (15 Marks)\nC) Oral (5 Marks)\n============================================================\n\n---------------- PART A : THEORY ----------------\n\nDOCUMENT OBJECT MODEL (DOM):\n - The DOM is a programming interface (API) for HTML and XML documents.\n - The browser converts the HTML page into a TREE of objects (nodes):\n       document -> html -> head, body -> elements -> text / attributes.\n - Using the DOM, JavaScript can access, add, change or delete HTML\n   elements, attributes, text and CSS styles dynamically.\n - Common methods: document.getElementById(), getElementsByClassName(),\n   querySelector(), createElement(), appendChild(), removeChild().\n - Common properties: innerHTML, innerText, style, value, className.\n\nPURPOSE OF JAVASCRIPT IN WEB DEVELOPMENT:\n - JavaScript is a lightweight, interpreted scripting language that runs\n   in the browser (and on servers with Node.js).\n - It makes web pages INTERACTIVE and DYNAMIC (HTML = structure,\n   CSS = style, JavaScript = behaviour).\n - Uses: form validation, handling events (click, hover, key press),\n   changing content/styles using the DOM, animations, timers, AJAX /\n   fetch API calls without reloading the page, creating web & mobile\n   apps (React, Angular, Node.js).\n\n---------------- PART B : PROGRAM ----------------\n\nAIM      : To change the background colour of the web page automatically\n           every 5 seconds using JavaScript and the DOM.\nOBJECTIVE: To use DOM property document.body.style.backgroundColor and the\n           timer function setInterval().\n\nALGORITHM:\n 1. Store several colour names in an array.\n 2. Write a function changeColor() that picks the next colour and applies it\n    to document.body.style.backgroundColor.\n 3. Call setInterval(changeColor, 5000) so it repeats every 5000 ms (5 s).\n 4. Display the current colour name on the page.\n\nEXPECTED OUTPUT:\n The page opens with a light blue background and the text\n \"Current background color: lightblue\". After every 5 seconds the colour\n changes (lightgreen, lightyellow, pink, lavender, orange ... and repeats).\n\nHOW TO RUN:\n Save as Q6_ChangeBackground.html and open it in any web browser.\n\n---------------- PART C : ORAL QUESTIONS ----------------\n Q. Difference between setTimeout and setInterval? -> setTimeout runs once after a delay;\n    setInterval runs repeatedly after every interval.\n Q. How do you stop setInterval?  -> clearInterval(id).\n Q. Difference between innerHTML and innerText? -> innerHTML parses HTML tags, innerText gives plain text.\n Q. Difference between == and ===? -> == compares value only, === compares value and type.\n Q. What is an event?  -> An action like click or load that JavaScript can respond to.\n Q. Difference between var, let and const? -> var is function scoped; let/const are block scoped;\n    const cannot be reassigned.\n-->\n\n\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n    \u003ctitle>Automatic Background Color\u003c/title>\n\u003c/head>\n\u003cbody>\n    \u003ch2>Background changes every 5 seconds\u003c/h2>\n\n    \u003cscript>\n        const colors = [\"lightblue\", \"lightgreen\", \"lightyellow\",\n                        \"pink\", \"lavender\"];\n        let index = 0;\n\n        setInterval(function () {\n            document.body.style.backgroundColor = colors[index];\n            index = (index + 1) % colors.length;\n        }, 5000);\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"file": "Q7_Lists.html", "question": "Q7\nA) Describe the basic structure of HTML document. (5 Marks)\nB) To write an HTML program to create ordered, unordered lists on\n   a web page. (15 Marks)\nC) Oral (5 Marks)", "code": "\u003c!--\n============================================================\nQ7\nA) Describe the basic structure of HTML document. (5 Marks)\nB) To write an HTML program to create ordered, unordered lists on\n   a web page. (15 Marks)\nC) Oral (5 Marks)\n============================================================\n\n---------------- PART A : THEORY ----------------\n\nHTML (HyperText Markup Language) is the standard markup language used to\ncreate the structure of web pages. A document is made of elements written\nwith tags.\n\nBASIC STRUCTURE:\n    \u003c!DOCTYPE html>          -> declares the document as HTML5\n    \u003chtml>                   -> root element, contains the whole page\n        \u003chead>               -> information about the page (not displayed)\n            \u003cmeta charset=\"UTF-8\">   -> character encoding\n            \u003ctitle>...\u003c/title>       -> text shown on the browser tab\n            \u003cstyle>, \u003clink>, \u003cscript> -> CSS / JS (optional)\n        \u003c/head>\n        \u003cbody>               -> visible content of the page\n            headings, paragraphs, lists, images, links, tables, forms...\n        \u003c/body>\n    \u003c/html>\n\n---------------- PART B : PROGRAM ----------------\n\nAIM      : To create ordered and unordered lists in HTML.\nOBJECTIVE: To learn the list tags: \u003col>, \u003cul>, \u003cli> (and nested lists).\n\nALGORITHM:\n 1. Write the basic HTML structure.\n 2. Use \u003cul> with \u003cli> for the unordered (bulleted) list.\n 3. Use \u003col> with \u003cli> for the ordered (numbered) list.\n 4. Show list types (type attribute) and a nested list as a bonus.\n\nEXPECTED OUTPUT:\n - An unordered list of fruits with bullets.\n - An ordered list of programming languages numbered 1, 2, 3...\n - An ordered list using Roman numerals (type=\"I\") and a nested list.\n\nHOW TO RUN:\n Save as Q7_Lists.html and open it in a web browser.\n\n---------------- PART C : ORAL QUESTIONS ----------------\n Q. Difference between ordered and unordered list? -> Ordered shows numbers/letters; unordered shows bullets.\n Q. Which tag defines a list item? -> \u003cli>.\n Q. What are the values of the type attribute of \u003col>? -> 1, A, a, I, i.\n Q. What is a description list? -> \u003cdl>, \u003cdt>, \u003cdd>.\n Q. Difference between block and inline elements? -> Block takes full width (div, p); inline takes only needed width (span, a).\n Q. What is the use of the DOCTYPE? -> Tells the browser the HTML version (HTML5).\n-->\n\n\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n    \u003ctitle>HTML Lists\u003c/title>\n\u003c/head>\n\u003cbody>\n    \u003ch2>Ordered List - Programming Languages\u003c/h2>\n    \u003col>\n        \u003cli>Java\u003c/li>\n        \u003cli>C\u003c/li>\n        \u003cli>Python\u003c/li>\n    \u003c/ol>\n\n    \u003ch2>Unordered List - Fruits\u003c/h2>\n    \u003cul>\n        \u003cli>Apple\u003c/li>\n        \u003cli>Mango\u003c/li>\n        \u003cli>Banana\u003c/li>\n    \u003c/ul>\n\u003c/body>\n\u003c/html>\n"}, {"file": "Q8_UserForm.html", "question": "Q8\nA) What is CSS? Discuss the types of CSS. (5 Marks)\nB) Write a program to design an HTML form to accept user details like\n   name, email, password, gender and submit the form using the Submit\n   button. (15 Marks)\nC) Oral (5 Marks)", "code": "\u003c!--\n============================================================\nQ8\nA) What is CSS? Discuss the types of CSS. (5 Marks)\nB) Write a program to design an HTML form to accept user details like\n   name, email, password, gender and submit the form using the Submit\n   button. (15 Marks)\nC) Oral (5 Marks)\n============================================================\n\n---------------- PART A : THEORY ----------------\n\nCSS (Cascading Style Sheets):\n - A style sheet language used to describe the presentation (look and\n   layout) of an HTML document: colours, fonts, spacing, borders,\n   backgrounds, positioning, responsiveness.\n - It separates content (HTML) from design (CSS).\n - Syntax:   selector { property: value; }\n                  p { color: red; font-size: 18px; }\n\nTYPES OF CSS:\n 1. Inline CSS   : Written inside the element using the style attribute.\n                       \u003cp style=\"color:red;\">Hello\u003c/p>\n                   Highest priority; used for a single element.\n 2. Internal CSS : Written inside a \u003cstyle> tag in the \u003chead> section.\n                   Applies to one page only.\n 3. External CSS : Written in a separate .css file and linked using\n                       \u003clink rel=\"stylesheet\" href=\"style.css\">\n                   Best for large sites; one file styles many pages.\n Priority order: Inline > Internal > External.\n\n---------------- PART B : PROGRAM ----------------\n\nAIM      : To design an HTML form that accepts name, email, password,\n           gender and submits using a Submit button.\nOBJECTIVE: To use form controls: input (text, email, password, radio),\n           label, and submit button.\n\nALGORITHM:\n 1. Create a \u003cform> with action and method.\n 2. Add text input for name, email input, password input.\n 3. Add radio buttons for gender (same name attribute so only one is chosen).\n 4. Add a Submit button and a Reset button.\n 5. Use the 'required' attribute for basic validation.\n 6. (Extra) Use JavaScript to show the submitted data in an alert.\n\nEXPECTED OUTPUT:\n A styled form with fields: Name, Email, Password, Gender (Male / Female /\n Other) and Submit / Reset buttons. On clicking Submit with valid data, an\n alert box shows the entered Name, Email and Gender (password not shown).\n\nHOW TO RUN:\n Save as Q8_UserForm.html and open it in a web browser.\n\n---------------- PART C : ORAL QUESTIONS ----------------\n Q. Difference between GET and POST method? -> GET appends data to URL (visible, limited);\n    POST sends data in the request body (secure, no size limit).\n Q. Use of the action attribute? -> URL where the form data is sent.\n Q. Why use the same name for radio buttons? -> So only one option can be selected in the group.\n Q. What does the 'required' attribute do? -> Prevents submission if the field is empty.\n Q. Difference between type=\"text\" and type=\"password\"? -> Password masks the characters.\n Q. What is the use of the label tag? -> Describes an input; clicking the label focuses the input.\n-->\n\n\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n    \u003ctitle>User Details Form\u003c/title>\n\u003c/head>\n\u003cbody>\n    \u003ch2>User Details\u003c/h2>\n\n    \u003cform action=\"#\" method=\"post\">\n        \u003clabel for=\"name\">Name:\u003c/label>\n        \u003cinput type=\"text\" id=\"name\" name=\"name\" required>\n        \u003cbr>\u003cbr>\n\n        \u003clabel for=\"email\">Email:\u003c/label>\n        \u003cinput type=\"email\" id=\"email\" name=\"email\" required>\n        \u003cbr>\u003cbr>\n\n        \u003clabel for=\"password\">Password:\u003c/label>\n        \u003cinput type=\"password\" id=\"password\" name=\"password\" required>\n        \u003cbr>\u003cbr>\n\n        Gender:\n        \u003cinput type=\"radio\" id=\"male\" name=\"gender\" value=\"Male\" required>\n        \u003clabel for=\"male\">Male\u003c/label>\n\n        \u003cinput type=\"radio\" id=\"female\" name=\"gender\" value=\"Female\">\n        \u003clabel for=\"female\">Female\u003c/label>\n\n        \u003cinput type=\"radio\" id=\"other\" name=\"gender\" value=\"Other\">\n        \u003clabel for=\"other\">Other\u003c/label>\n        \u003cbr>\u003cbr>\n\n        \u003cinput type=\"submit\" value=\"Submit\">\n    \u003c/form>\n\u003c/body>\n\u003c/html>\n"}, {"file": "Q9_Interface.java", "question": "Q9\nA) What is React JS? What is the difference between functional\n   and class components? (5 Marks)\nB) Write a program to demonstrate the concept of interface in\n   Java. (15 Marks)\nC) Oral (5 Marks)", "code": "/*\n * ============================================================\n * Q9\n * A) What is React JS? What is the difference between functional\n *    and class components? (5 Marks)\n * B) Write a program to demonstrate the concept of interface in\n *    Java. (15 Marks)\n * C) Oral (5 Marks)\n * ============================================================\n *\n * ---------------- PART A : THEORY ----------------\n *\n * REACT JS:\n *  - An open-source JavaScript library developed by Facebook (Meta) for\n *    building user interfaces, mainly single-page applications (SPA).\n *  - Key features: component-based architecture, Virtual DOM (fast\n *    updates), JSX (HTML-like syntax in JavaScript), one-way data\n *    binding, reusable components, Hooks.\n *\n * FUNCTIONAL vs CLASS COMPONENTS:\n *  -------------------------------------------------------------------\n *  | Functional Component            | Class Component                |\n *  |---------------------------------|--------------------------------|\n *  | A plain JavaScript function     | An ES6 class extending         |\n *  | that returns JSX.               | React.Component.               |\n *  | State & lifecycle handled with  | State handled with this.state  |\n *  | Hooks (useState, useEffect).    | and lifecycle methods          |\n *  |                                 | (componentDidMount, etc.).     |\n *  | No 'this' keyword.              | Uses 'this' keyword.           |\n *  | Less code, easier to read/test. | More code (boilerplate).       |\n *  | Modern & recommended.           | Older style.                   |\n *  | function Hello(){return \u003ch1/>;} | class Hello extends Component  |\n *  |                                 | { render(){return \u003ch1/>;} }    |\n *  -------------------------------------------------------------------\n *\n * ---------------- PART B : PROGRAM ----------------\n *\n * AIM      : To demonstrate the concept of interface in Java.\n * OBJECTIVE: To achieve 100% abstraction and multiple inheritance\n *            using interfaces.\n *\n * THEORY OF INTERFACE:\n *  - An interface is a blueprint of a class containing abstract methods\n *    (public abstract by default) and constants (public static final).\n *  - Declared with 'interface'; implemented by a class using 'implements'.\n *  - A class can implement MULTIPLE interfaces (multiple inheritance).\n *  - From Java 8, interfaces may contain default and static methods.\n *\n * ALGORITHM:\n *  1. Create interface Printable with method print() and interface\n *     Showable with method show().\n *  2. Create interface Vehicle with abstract method start() and a\n *     default method stop().\n *  3. Class Car implements Vehicle (single interface).\n *  4. Class Document implements both Printable and Showable\n *     (multiple inheritance).\n *  5. Create objects in main() and call the methods.\n *\n * EXPECTED OUTPUT:\n *      Car is starting with key...\n *      Vehicle stopped (default method).\n *      Max speed of vehicle = 180\n *      Document is being printed.\n *      Document is being shown on screen.\n *\n * HOW TO RUN:\n *      javac Q9_Interface.java\n *      java Q9_Interface\n */\n\ninterface Printable {\n    void print();\n}\n\nclass Document implements Printable {\n    public void print() {\n        System.out.println(\"Printing document\");\n    }\n\n    public static void main(String[] args) {\n        Document d = new Document();\n        d.print();\n    }\n}\n\n/*\n * ---------------- PART C : ORAL QUESTIONS ----------------\n * Q. Can we create an object of an interface? -> No (but we can create a reference).\n * Q. Difference between abstract class and interface? -> Abstract class can have constructors,\n *    instance variables and concrete methods; interface mainly has abstract methods and constants,\n *    supports multiple inheritance.\n * Q. Why are interface variables final?  -> They are public static final constants.\n * Q. Can an interface extend another interface? -> Yes, using 'extends' (even multiple).\n * Q. What is a marker interface? -> Interface with no methods (Serializable, Cloneable).\n * Q. What is a functional interface? -> Interface with exactly one abstract method (Runnable);\n *    used with lambdas.\n * Q. What is Virtual DOM in React? -> Lightweight copy of the real DOM; React compares changes\n *    and updates only the changed parts.\n */\n"}, {"file": "Q10_CSSPage.html", "question": "Q10\nA) What are implicit and explicit objects in JSP? Explain with\n   examples. (5 Marks)\nB) Write a program to design a web page using CSS properties such as\n   background color, text color, font size, borders, and alignment.\n   (15 Marks)\nC) Oral (5 Marks)", "code": "\u003c!--\n============================================================\nQ10\nA) What are implicit and explicit objects in JSP? Explain with\n   examples. (5 Marks)\nB) Write a program to design a web page using CSS properties such as\n   background color, text color, font size, borders, and alignment.\n   (15 Marks)\nC) Oral (5 Marks)\n============================================================\n\n---------------- PART A : THEORY ----------------\n\nJSP (JavaServer Pages) is a server-side technology used to create dynamic\nweb pages by embedding Java code in HTML using scriptlet tags \u003c% %>.\n\nIMPLICIT OBJECTS:\n - Objects that are created automatically by the JSP container (web\n   server) in every JSP page. The programmer can use them directly\n   WITHOUT declaring or creating them. There are 9 implicit objects:\n\n   Object        Type                     Use\n   -----------   ----------------------   ---------------------------------\n   out           JspWriter                writes output to the page\n   request       HttpServletRequest       gets form / request data\n   response      HttpServletResponse      sends response (redirect, cookies)\n   session       HttpSession              stores data across multiple requests\n   application   ServletContext           data shared by the whole application\n   config        ServletConfig            servlet configuration parameters\n   pageContext   PageContext              access to all scopes of the page\n   page          Object (this)            refers to the current JSP page\n   exception     Throwable                error info (only on error pages)\n\n   Example (JSP):\n       \u003c%\n           String user = request.getParameter(\"username\");   // request object\n           out.println(\"Welcome \" + user);                    // out object\n           session.setAttribute(\"name\", user);                // session object\n       %>\n\nEXPLICIT OBJECTS:\n - Objects that the programmer creates (declares) explicitly in the JSP\n   code using the 'new' keyword or the \u003cjsp:useBean> tag. They are not\n   provided by the container automatically.\n\n   Example (JSP):\n       \u003c%\n           java.util.Date d = new java.util.Date();           // explicit object\n           out.println(\"Current date: \" + d);\n       %>\n       \u003cjsp:useBean id=\"emp\" class=\"com.demo.Employee\" scope=\"session\" />\n       \u003cjsp:setProperty name=\"emp\" property=\"name\" value=\"Rahul\" />\n\n   In short: Implicit = ready-made by container, no creation needed.\n             Explicit = created by the programmer.\n\n---------------- PART B : PROGRAM ----------------\n\nAIM      : To design a web page using CSS properties background color, text\n           color, font size, borders and alignment.\nOBJECTIVE: To apply Internal CSS using selectors (element, class, id).\n\nALGORITHM:\n 1. Create HTML structure with a header, a section and a footer.\n 2. Write an internal \u003cstyle> block.\n 3. Apply background-color, color, font-size, border, text-align, padding.\n 4. Show different border styles (solid, dashed, dotted, double).\n\nEXPECTED OUTPUT:\n A web page with a dark blue centred header with white text, a light grey\n body, a bordered content box with centred heading, paragraphs with different\n alignment (left / centre / right) and borders, and a green footer.\n\nHOW TO RUN:\n Save as Q10_CSSPage.html and open it in a web browser.\n\n---------------- PART C : ORAL QUESTIONS ----------------\n Q. What is the CSS box model? -> Content + padding + border + margin.\n Q. Difference between class and id selector? -> class (.name) can be reused; id (#name) is unique.\n Q. Difference between padding and margin? -> Padding is inside the border; margin is outside.\n Q. What is the difference between inline and block elements?\n Q. Which property changes text colour? -> color.  Background? -> background-color.\n Q. What is the use of the JSP 'session' object? -> To keep user data across multiple requests.\n Q. Difference between include directive and include action in JSP? -> Directive includes at\n    translation time (static); action includes at request time (dynamic).\n-->\n\n\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n    \u003ctitle>CSS Properties Demo\u003c/title>\n    \u003cstyle>\n        body {\n            background-color: #eef5ff;\n            color: #222222;\n            font-family: Arial, sans-serif;\n            text-align: center;\n        }\n\n        .box {\n            background-color: white;\n            color: #17365d;\n            font-size: 20px;\n            border: 2px solid #2f5597;\n            border-radius: 8px;\n            padding: 20px;\n            margin: 30px auto;\n            width: 70%;\n            text-align: center;\n        }\n\n        p {\n            font-size: 16px;\n            color: #333333;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody>\n    \u003ch1>CSS Styling Example\u003c/h1>\n\n    \u003cdiv class=\"box\">\n        \u003ch2>Welcome to My Web Page\u003c/h2>\n        \u003cp>This page demonstrates CSS properties.\u003c/p>\n    \u003c/div>\n\u003c/body>\n\u003c/html>\n"}]</script>
<script>
(function(){
  var items = JSON.parse(document.getElementById('data').textContent);
  var ed = document.getElementById('editor');
  var zoom = 100, wrap = false;

  items.forEach(function(it, i){
    var d = document.createElement('div'); d.className = 'entry'; d.id = 'q' + (i+1);
    var bar = document.createElement('div'); bar.className = 'qbar';
    var q = document.createElement('pre'); q.className = 'qtext'; q.textContent = it.question;
    var b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Copy'; b.type = 'button';
    b.addEventListener('click', function(){ copyText(it.code, b); });
    bar.appendChild(q); bar.appendChild(b);
    var f = document.createElement('div'); f.className = 'file'; f.textContent = it.file;
    var c = document.createElement('pre'); c.className = 'code'; c.textContent = it.code;
    d.appendChild(bar); d.appendChild(f); d.appendChild(c);
    ed.appendChild(d);
  });

  function copyText(text, btn){
    function ok(){ if(!btn) return; var o = btn.textContent; btn.textContent = 'Copied!'; btn.classList.add('done');
      setTimeout(function(){ btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1500); }
    function fallback(){
      var t = document.createElement('textarea'); t.value = text; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ alert('Copy failed — select the code and press Ctrl+C'); }
      document.body.removeChild(t);
    }
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(ok, fallback); } else fallback();
  }

  function setZoom(z){ zoom = Math.max(50, Math.min(300, z));
    document.documentElement.style.setProperty('--size', (15*zoom/100)+'px');
    document.getElementById('sZ').textContent = zoom + '%'; }
  function current(){
    var n = 0, top = ed.getBoundingClientRect().top + 40;
    items.forEach(function(_, i){ if(document.getElementById('q'+(i+1)).getBoundingClientRect().top <= top) n = i; });
    return n;
  }
  ed.addEventListener('scroll', function(){
    var n = current(); document.getElementById('sQ').textContent = 'Question ' + (n+1) + ' of ' + items.length;
    document.getElementById('ttl').textContent = items[n].file + ' - Notepad';
    document.getElementById('sPos').textContent = 'Ln ' + (Math.round(ed.scrollTop/ (parseFloat(getComputedStyle(ed).lineHeight)||20))+1) + ', Col 1';
  });

  var actions = {
    copyall: function(){ copyText(items.map(function(i){return i.code;}).join('\n\n'), null); alert('All code copied.'); },
    top: function(){ ed.scrollTo({top:0}); },
    print: function(){ window.print(); },
    selall: function(){ var r = document.createRange(); r.selectNodeContents(ed); var s = getSelection(); s.removeAllRanges(); s.addRange(r); },
    find: function(){ var n = parseInt(prompt('Go to question number (1-' + items.length + '):'), 10);
      if(n>=1 && n<=items.length) document.getElementById('q'+n).scrollIntoView(); },
    wrap: function(){ wrap = !wrap; ed.classList.toggle('wrap', wrap); },
    zin: function(){ setZoom(zoom+10); }, zout: function(){ setZoom(zoom-10); }, zreset: function(){ setZoom(100); },
    theme: function(){ var r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; try{localStorage.setItem('theme', r.dataset.theme);}catch(e){} },
    help: function(){ alert('Click the Copy button next to any question to copy its full code exactly as it is.'); }
  };
  try{ var t = localStorage.getItem('theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}

  var menus = document.querySelectorAll('.menu');
  menus.forEach(function(m){
    m.querySelector('button').addEventListener('click', function(e){ e.stopPropagation();
      var was = m.classList.contains('open'); menus.forEach(function(x){x.classList.remove('open');}); if(!was) m.classList.add('open'); });
    m.addEventListener('mouseenter', function(){ if(document.querySelector('.menu.open')){ menus.forEach(function(x){x.classList.remove('open');}); m.classList.add('open'); } });
  });
  document.querySelectorAll('.dd button').forEach(function(b){ b.addEventListener('click', function(){
    menus.forEach(function(x){x.classList.remove('open');}); actions[b.dataset.a](); }); });
  document.addEventListener('click', function(){ menus.forEach(function(x){x.classList.remove('open');}); });
  document.addEventListener('keydown', function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    if(e.key==='+'||e.key==='='){ e.preventDefault(); setZoom(zoom+10); }
    else if(e.key==='-'){ e.preventDefault(); setZoom(zoom-10); }
    else if(e.key==='0'){ e.preventDefault(); setZoom(100); }
    else if(e.key==='g'){ e.preventDefault(); actions.find(); }
    else if(e.key==='Home'){ e.preventDefault(); actions.top(); }
  });
  ed.dispatchEvent(new Event('scroll'));
})();
</script>
</body>
</html>
